<?xml version="1.0" encoding="UTF-8"?>
<!--
  Superlion: the flywheel of the Fowler B6 Super Lion "Supreme", seen from slightly below.

  The wheel is drawn face-on and flattened a little (scale 1 x 0.95). Seen from
  below, anything further from the viewer appears lower and anything nearer
  appears higher, so:
  - the bare iron outside of the rim shows as a band beneath the face;
  - the web, recessed behind the rim, sits lower than the rim opening, revealing
    the underside of the rim's top lip as a dark crescent;
  - the bell-shaped hub rises towards the viewer, so its crown sits higher than
    its flared base.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <!-- Bare cast iron on the outside of the rim. -->
    <!-- Bare cast iron is matte: soft, low-contrast shading with no highlights.
         The side band starts at the same tone as the face's edge, so the two
         meet without a step at the widest point, and darkens further down. -->
    <linearGradient id="iron" x1="0" x2="0" y1="0" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f2b29"/>
      <stop offset="0.7" stop-color="#252220"/>
      <stop offset="1" stop-color="#1c1a19"/>
    </linearGradient>
    <linearGradient id="ironEdge" x1="0" x2="0" y1="-54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3c3735"/>
      <stop offset="0.5" stop-color="#2f2b29"/>
      <stop offset="1" stop-color="#282523"/>
    </linearGradient>
    <linearGradient id="rimCorner" x1="0" x2="0" y1="0" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141211" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#141211" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#141211" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="rimFace" cx="-20" cy="-26" r="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c0303f"/>
      <stop offset="0.6" stop-color="#951c2a"/>
      <stop offset="1" stop-color="#5e0f19"/>
    </radialGradient>
    <!-- Underside of the rim's top lip, in shadow. -->
    <linearGradient id="lip" x1="0" x2="0" y1="-45" y2="-30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#26050a"/>
      <stop offset="1" stop-color="#4a0b14"/>
    </linearGradient>
    <radialGradient id="web" cx="-14" cy="-12" r="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a62233"/>
      <stop offset="0.6" stop-color="#84182a"/>
      <stop offset="1" stop-color="#5a0e18"/>
    </radialGradient>
    <radialGradient id="dish" cx="-6" cy="4" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9d2030"/>
      <stop offset="0.7" stop-color="#76131f"/>
      <stop offset="1" stop-color="#4f0c15"/>
    </radialGradient>
    <!-- Bell hub: one continuous surface, lit from the upper left. Every part of it
         slopes down and outwards from the cap, so its upper-left side faces the light. -->
    <linearGradient id="flareShade" x1="-18" y1="-20" x2="16" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c0303f"/>
      <stop offset="0.5" stop-color="#8a1a27"/>
      <stop offset="1" stop-color="#4f0c15"/>
    </linearGradient>
    <radialGradient id="flareFade" cx="0" cy="-1.5" r="23" gradientUnits="userSpaceOnUse">
      <stop offset="0.6" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="flareMask" maskUnits="userSpaceOnUse" x="-30" y="-30" width="60" height="60">
      <circle cy="-1.5" r="23" fill="url(#flareFade)"/>
    </mask>
    <radialGradient id="shoulder" cx="-4" cy="-10" r="17" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d34558"/>
      <stop offset="0.45" stop-color="#a62233"/>
      <stop offset="0.8" stop-color="#7a1521"/>
      <stop offset="1" stop-color="#6e1520" stop-opacity="0"/>
    </radialGradient>
    <!-- Flat chrome cap: an even diagonal sheen across the face. -->
    <linearGradient id="capFace" x1="-9" y1="-17" x2="8" y2="2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#deddda"/>
      <stop offset="0.6" stop-color="#b0aeab"/>
      <stop offset="1" stop-color="#77767b"/>
    </linearGradient>
    <!-- Edge of the cap, seen beneath its face. -->
    <linearGradient id="capSide" x1="-10.5" x2="10.5" y1="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5e5c64"/>
      <stop offset="0.3" stop-color="#deddda"/>
      <stop offset="0.55" stop-color="#9a9996"/>
      <stop offset="1" stop-color="#3d3846"/>
    </linearGradient>
    <!-- Gloss: a soft clear-coat reflection, white fading to nothing. -->
    <radialGradient id="sheen" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Reflection band across the flat chrome cap. -->
    <linearGradient id="capReflection" x1="-10" y1="-18" x2="8" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0.28" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.38" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.68" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.74" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="capClip">
      <circle cy="-8" r="10.5"/>
    </clipPath>
    <clipPath id="opening">
      <circle r="45"/>
    </clipPath>
    <filter id="ringShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <!-- Soft drop shadow. -->
  <ellipse cx="64" cy="66" rx="54" ry="53" fill="#000" opacity="0.22" filter="url(#soften)"/>

  <g transform="translate(64 60) scale(1 0.95)">
    <!-- Bare iron outside of the rim, seen beneath the face. -->
    <path d="M -54 0 L -54 8 A 54 54 0 0 0 54 8 L 54 0 Z" fill="url(#iron)"/>

    <!-- Front face of the rim: an iron edge, then the painted face. -->
    <circle r="54" fill="url(#ironEdge)"/>
    <!-- Corner where the rim's face meets its side, fading out at the widest point. -->
    <path d="M -54 0 A 54 54 0 0 0 54 0" fill="none" stroke="url(#rimCorner)" stroke-width="0.9"/>
    <!-- Where the paint stops on the iron. -->
    <circle r="51" fill="none" stroke="#120f0e" stroke-width="0.7" opacity="0.6"/>
    <circle r="51" fill="url(#rimFace)"/>
    <!-- Raised brass ring near the rim. -->
    <circle cy="0.9" r="48" fill="none" stroke="#000" stroke-width="1.6" opacity="0.35" filter="url(#ringShadow)"/>
    <circle r="48" fill="none" stroke="#c88a12" stroke-width="1.6"/>
    <circle cx="-0.35" cy="-0.35" r="48" fill="none" stroke="#fff4c2" stroke-width="0.61" opacity="1"/>
    <circle cx="0.35" cy="0.35" r="48" fill="none" stroke="#6b4806" stroke-width="0.61" opacity="0.7"/>

    <!-- Gloss on the painted rim: a soft sheen and a crisp specular line. -->
    <path d="M -47.33 -12.68 A 49.0 49.0 0 0 1 -6.82 -48.52" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.18"/>
    <path d="M -44.95 -20.96 A 49.6 49.6 0 0 1 -16.96 -46.61" fill="none" stroke="#ffffff" stroke-width="0.9" stroke-linecap="round" opacity="0.75"/>
    <path d="M 23.00 -39.84 A 46.0 46.0 0 0 1 39.84 -23.00" fill="none" stroke="#ffffff" stroke-width="0.7" stroke-linecap="round" opacity="0.35"/>
    <!-- Inside the rim: the lip's underside, then the recessed web drawn lower. -->
    <g clip-path="url(#opening)">
      <circle r="45" fill="url(#lip)"/>
      <g transform="translate(0 6)">
        <circle r="45" fill="url(#web)"/>
        <!-- Raised lining rings: chrome, brass, a black coachline, brass, chrome. -->
        <circle cy="0.9" r="36" fill="none" stroke="#000" stroke-width="3.2" opacity="0.35" filter="url(#ringShadow)"/>
        <circle r="36" fill="none" stroke="#c0bfbc" stroke-width="3.2"/>
        <circle cx="-0.7" cy="-0.7" r="36" fill="none" stroke="#ffffff" stroke-width="1.22" opacity="1"/>
        <circle cx="0.7" cy="0.7" r="36" fill="none" stroke="#5e5c64" stroke-width="1.22" opacity="0.7"/>
        <circle cy="0.9" r="33.4" fill="none" stroke="#000" stroke-width="1.2" opacity="0.35" filter="url(#ringShadow)"/>
        <circle r="33.4" fill="none" stroke="#c88a12" stroke-width="1.2"/>
        <circle cx="-0.26" cy="-0.26" r="33.4" fill="none" stroke="#fff4c2" stroke-width="0.46" opacity="1"/>
        <circle cx="0.26" cy="0.26" r="33.4" fill="none" stroke="#6b4806" stroke-width="0.46" opacity="0.7"/>
        <circle cy="0.9" r="30.6" fill="none" stroke="#000" stroke-width="4.4" opacity="0.35" filter="url(#ringShadow)"/>
        <circle r="30.6" fill="none" stroke="#141414" stroke-width="4.4"/>
        <circle cx="-0.97" cy="-0.97" r="30.6" fill="none" stroke="#55555a" stroke-width="1.1" opacity="0.75"/>
        <circle cx="0.97" cy="0.97" r="30.6" fill="none" stroke="#000000" stroke-width="1.67" opacity="0.7"/>
        <circle cy="0.9" r="27.8" fill="none" stroke="#000" stroke-width="1.2" opacity="0.35" filter="url(#ringShadow)"/>
        <circle r="27.8" fill="none" stroke="#c88a12" stroke-width="1.2"/>
        <circle cx="-0.26" cy="-0.26" r="27.8" fill="none" stroke="#fff4c2" stroke-width="0.46" opacity="1"/>
        <circle cx="0.26" cy="0.26" r="27.8" fill="none" stroke="#6b4806" stroke-width="0.46" opacity="0.7"/>
        <circle cy="0.9" r="26.3" fill="none" stroke="#000" stroke-width="1.2" opacity="0.35" filter="url(#ringShadow)"/>
        <circle r="26.3" fill="none" stroke="#c0bfbc" stroke-width="1.2"/>
        <circle cx="-0.26" cy="-0.26" r="26.3" fill="none" stroke="#ffffff" stroke-width="0.46" opacity="1"/>
        <circle cx="0.26" cy="0.26" r="26.3" fill="none" stroke="#5e5c64" stroke-width="0.46" opacity="0.7"/>
        <circle r="25.5" fill="url(#dish)"/>
        <circle r="25.5" fill="none" stroke="#3b0810" stroke-width="1" opacity="0.6"/>

        <!-- Clear-coat reflection on the painted web. -->
        <ellipse cx="-17" cy="-15" rx="1" ry="1" fill="url(#sheen)" transform="translate(-17 -15) rotate(-38) scale(17 8) translate(17 15)"/>
        <!-- Bell-shaped hub. Its crown is nearest the viewer, so each part sits a little higher. -->
        <!-- Concave flare, fading into the dish so the bell rises out of the wheel. -->
        <circle cy="-1.5" r="23" fill="url(#flareShade)" mask="url(#flareMask)"/>
        <!-- Convex shoulder. -->
        <circle cy="-5" r="16" fill="url(#shoulder)"/>
        <!-- Gloss on the bell's shoulder. -->
        <path d="M -12.78 -9.65 A 13.6 13.6 0 0 1 -3.52 -18.14" fill="none" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" opacity="0.55"/>
        <!-- Flat chrome cap covering the axle end, with a fine gold line where it meets the paint. -->
        <circle cy="-5.5" r="11.2" fill="none" stroke="#e5a50a" stroke-width="0.9" opacity="0.85"/>
        <path d="M -10.5 -8 L -10.5 -5.5 A 10.5 10.5 0 0 0 10.5 -5.5 L 10.5 -8 Z" fill="url(#capSide)"/>
        <circle cy="-8" r="10.5" fill="url(#capFace)"/>
        <circle cy="-8" r="10.5" fill="url(#capReflection)" clip-path="url(#capClip)"/>
        <circle cy="-8" r="9.9" fill="none" stroke="#ffffff" stroke-width="0.8" opacity="0.95"/>
      </g>
      <!-- Shadow cast by the top lip onto the web. -->
      <path d="M -45 -4 A 45 45 0 0 1 45 -4 A 46 40 0 0 0 -45 -4 Z" fill="#000" opacity="0.18"/>
    </g>
    <circle r="45" fill="none" stroke="#3b0810" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- Soft highlight on the upper left of the painted rim. -->
  <path d="M 20 44 A 49 47 0 0 1 70 13" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" opacity="0.35"/>
</svg>
